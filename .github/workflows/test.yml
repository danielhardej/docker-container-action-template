name: Test Docker Action

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Test Docker Action with default inputs
      id: test-default
      uses: ./
      
    - name: Test Docker Action with custom inputs
      id: test-custom
      uses: ./
      with:
        name: 'GitHub Actions'
        message: 'Greetings from'
        
    - name: Display outputs
      run: |
        echo "Default test result: ${{ steps.test-default.outputs.greeting }}"
        echo "Custom test result: ${{ steps.test-custom.outputs.greeting }}"
        echo "Execution time: ${{ steps.test-custom.outputs.time }}"